[workspace]
resolver = "2"
members = [
    "crates/analyzer-core",
    "crates/analyzer-executable",
    "crates/analyzer-state",
    "crates/analyzer-auth",
    "crates/analyzer-evidence",
    "crates/analyzer-report",
    "crates/analyzer-rehearsal",
    "crates/analyzer-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.84.0"
license = "Apache-2.0"
repository = "https://github.com/SorobanLabs/sorobanlabs-analyzer"

[workspace.dependencies]
analyzer-core = { path = "crates/analyzer-core" }
analyzer-executable = { path = "crates/analyzer-executable" }
analyzer-state = { path = "crates/analyzer-state" }
analyzer-auth = { path = "crates/analyzer-auth" }
analyzer-evidence = { path = "crates/analyzer-evidence" }
analyzer-report = { path = "crates/analyzer-report" }
analyzer-rehearsal = { path = "crates/analyzer-rehearsal" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.20"
sha2 = "=0.10.9"
toml = "=0.8.19"
hex = "=0.4.3"
clap = { version = "=4.5.20", features = ["derive"] }
proptest = "=1.11.0"
# Pinned to the exact version the official rs-soroban-env workspace
# pins (https://github.com/stellar/rs-soroban-env/blob/main/Cargo.toml,
# `wasmparser = "=0.116.1"`), because Soroban's host requires this exact
# wasmparser release to stay compatible with its Wasmi fork. Do not
# upgrade independently of that upstream constraint.
wasmparser = "=0.116.1"
# stellar-xdr 28.0.0 matches the current released Stellar Protocol 28 /
# soroban-env-host 28.x line and declares rust-version = "1.84.0"
# (verified against https://github.com/stellar/rs-stellar-xdr), so it
# fits this workspace's MSRV without modification. Default features
# (`std`, `curr`) are used: `curr` tracks the current protocol XDR.
stellar-xdr = { version = "=28.0.0", features = ["base64"] }
# ureq's 3.x line declares MSRV 1.85 (above this workspace's 1.84.0);
# the 2.x line declares MSRV 1.71 and is used instead, for the
# read-only Soroban RPC client. Blocking (matches this workspace's
# entirely synchronous architecture; no async runtime is otherwise
# needed) and small (no tokio/hyper dependency tree).
#
# Two of ureq's transitive dependencies (idna_adapter, pulled in via
# `url`, and zeroize, pulled in via `ring`) publish newer releases that
# require edition2024; Cargo.lock pins them to idna_adapter 1.2.0 and
# zeroize 1.8.1 to stay on 1.84.0. Both are non-cryptographic-logic
# packaging/size changes in their newer releases (no RustSec advisory
# applies to either the pinned or newer version at the time this was
# written); the resolved `idna` crate itself (1.1.0) is well above the
# version RUSTSEC-2024-0421 was fixed in (1.0.3), so no known
# vulnerability is reintroduced by these two pins.
ureq = "=2.12.1"
# soroban-env-host 28.0.2 is the released version matching stellar-xdr
# 28.0.0 and wasmparser 0.116.1 exactly (verified against
# https://github.com/stellar/rs-soroban-env/blob/v28.0.2/Cargo.toml,
# and against soroban-sdk 28.0.0's own declared soroban-env-host
# dependency, "=28.0.2"). Feasibility (Step 23) was verified by an
# actual local build and a real invocation of a stellar-cli-built
# Soroban contract through this exact dependency, not by inspection
# alone. `testutils` is enabled: it is the officially-supported path
# for loading and invoking a WASM contract without also constructing
# the full transaction-level footprint/resource XDR that the
# production `e2e_invoke::invoke_host_function` entry point expects;
# it enables `recording_mode` (dynamic footprint recording, so a fresh
# contract registration does not require pre-declaring it) and does
# not pull soroban-env-host's own dev-dependencies into consumers.
#
# Building this dependency under 1.84.0 required five additional
# Cargo.lock pins beyond the ureq-related ones above, all transitive,
# none of them soroban-env-host's own code: cpufeatures (via
# curve25519-dalek, downgraded from its default-resolved 5.0.0 to
# 4.1.3, which the `>=4.1.3` constraint soroban-env-host itself
# declares already allows), enum-ordinalize and enum-ordinalize-derive
# (via ark-ec's `educe` dependency, pinned to 4.3.2), base64ct (pinned
# to 1.7.3), and zeroize_derive (via zeroize, pinned to 1.4.3, matching
# the zeroize 1.8.1 already pinned above). Each is a RustCrypto-ecosystem
# utility crate; no RustSec advisory was found for any pinned or newer
# version at the time this was written.
soroban-env-host = { version = "=28.0.2", features = ["testutils"] }

[profile.release]
opt-level = "z"
lto = true

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
