[workspace]
members = [
    "v1",
    "v2_identical",
    "v2_changed_return",
    "v2_changed_error",
    "v2_changed_event",
    "v2_changed_state",
    "v2_fails",
]
resolver = "2"

[workspace.dependencies]
soroban-sdk = "=28.0.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
