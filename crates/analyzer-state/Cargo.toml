[package]
name = "analyzer-state"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Contract state representation, snapshots, and state compatibility analysis."

[dependencies]
analyzer-core.workspace = true
analyzer-evidence.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
stellar-xdr.workspace = true
hex.workspace = true
sha2.workspace = true
ureq.workspace = true
# Pinned transitively via toml_edit to keep the resolved graph on the
# 1.84.0 MSRV; newer indexmap/toml_edit releases require edition2024.
indexmap = "=2.5.0"
toml_edit = "=0.22.20"

[dev-dependencies]
proptest.workspace = true
# Pinned to an exact version verified to build under the workspace's
# 1.84.0 MSRV (see the msrv CI job). tempfile's transitive dependency
# tree has pulled in getrandom releases that require edition2024 in
# the past, so any bump here should be re-verified against 1.84.0
# before updating the pin.
tempfile = "=3.27.0"

[lints]
workspace = true
