[package]
name = "analyzer-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for the SorobanLabs Analyzer."
default-run = "sorobanlabs-analyzer"

[lib]
name = "analyzer_cli"
path = "src/lib.rs"

[[bin]]
name = "sorobanlabs-analyzer"
path = "src/main.rs"

[dependencies]
analyzer-core.workspace = true
analyzer-executable.workspace = true
analyzer-state.workspace = true
analyzer-auth.workspace = true
analyzer-rehearsal.workspace = true
analyzer-evidence.workspace = true
analyzer-report.workspace = true
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Pinned to an exact version verified to build under the workspace's
# 1.84.0 MSRV (see the msrv CI job). tempfile's transitive dependency
# tree has pulled in getrandom releases that require edition2024 in
# the past, so any bump here should be re-verified against 1.84.0
# before updating the pin.
tempfile = "=3.27.0"
hex.workspace = true
soroban-env-host.workspace = true
stellar-xdr.workspace = true

[lints]
workspace = true
