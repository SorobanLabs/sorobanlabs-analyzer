[package]
name = "analyzer-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Command-line interface for the SorobanLabs Analyzer."
default-run = "sorobanlabs-analyzer"

[lib]
name = "analyzer_cli"
path = "src/lib.rs"

[[bin]]
name = "sorobanlabs-analyzer"
path = "src/main.rs"

[dependencies]
analyzer-core.workspace = true
analyzer-executable.workspace = true
analyzer-state.workspace = true
analyzer-auth.workspace = true
analyzer-rehearsal.workspace = true
analyzer-evidence.workspace = true
analyzer-report.workspace = true
clap.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Pinned transitively via proptest/rusty-fork to keep the resolved graph
# on the 1.84.0 MSRV; newer tempfile releases pull in getrandom 0.4,
# which requires edition2024.
tempfile = "=3.14.0"
hex.workspace = true
soroban-env-host.workspace = true

[lints]
workspace = true
